<!DOCTYPE html>
<html>
<head>
    <title>Driver Transmitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        input, button { font-size: 1.2rem; padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Transit Driver Login</h2>
    <input type="text" id="busId" placeholder="Enter Bus ID (e.g., Route-42)">
    <button id="startBtn" onclick="startTracking()">Start Transmitting</button>
    <p id="status">Status: Waiting to start...</p>

    <script>
        let wakeLock = null;

        // Request wake lock to prevent the phone screen from turning off
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        function startTracking() {
            const busId = document.getElementById('busId').value;
            if (!busId) {
                alert("Please enter a Bus ID");
                return;
            }

            if (navigator.geolocation) {
                requestWakeLock();
                document.getElementById('status').innerText = "Status: Transmitting Live Location...";
                document.getElementById('startBtn').disabled = true;
                
                // Watch position triggers automatically as the phone moves
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // POST the coordinates to the Python backend
                        fetch('/api/location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bus_id: busId, lat: lat, lng: lng })
                        });
                    },
                    (error) => {
                        document.getElementById('status').innerText = "GPS Error: " + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 } // Forces GPS hardware usage
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }
    </script>
</body>
</html>
